name: Render Free Web Service Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Missing repository secret: RENDER_URL"
            exit 1
          fi
          RENDER_URL="${RENDER_URL%/}"
          curl --fail --silent --show-error --max-time 40 --retry 2 "$RENDER_URL/healthz"
